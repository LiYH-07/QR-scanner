<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>庫存查看</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f7;
      --surface: #ffffff;
      --surface2: #f4f6fb;
      --border: rgba(0,0,0,0.07);
      --text-primary: #1a1d26;
      --text-secondary: #5a6278;
      --text-muted: #98a0b4;
      --accent: #3b6ef8;
      --accent-soft: rgba(59,110,248,0.1);
      --accent2: #0db97a;
      --accent2-soft: rgba(13,185,122,0.1);
      --warn: #f09a0d;
      --warn-soft: rgba(240,154,13,0.1);
      --danger: #e84040;
      --danger-soft: rgba(232,64,64,0.1);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
      --radius: 16px;
      --radius-sm: 10px;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Noto Sans TC', sans-serif;
      --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
    }
    
    /* 🌙 黑夜模式色彩強化 (高對比) */
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #121212;
      --surface: #1e1e1e;
      --surface2: #2c2c2c;
      --border: rgba(255,255,255,0.15);
      --text-primary: #ffffff;
      --text-secondary: #cccccc;
      --text-muted: #999999;
      --accent: #6b9bff;
      --accent-soft: rgba(107,155,255,0.15);
      --accent2: #4ade80;
      --accent2-soft: rgba(74,222,128,0.15);
      --warn: #fbbf24;
      --warn-soft: rgba(251,191,36,0.15);
      --danger: #f87171;
      --danger-soft: rgba(248,113,113,0.15);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.5);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.6);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
    }

    /* ── HEADER ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .header-inner {
      max-width: 1080px; margin: 0 auto;
      height: 60px;
      display: flex; align-items: center; gap: 14px;
    }
    .logo {
      display: flex; align-items: center; gap: 9px;
      font-weight: 700; font-size: 16px;
      white-space: nowrap; flex-shrink: 0;
      color: var(--text-primary);
    }
    .logo-box {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
      color: #fff;
    }

    /* update status */
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-family: var(--mono); font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      max-width: 240px;
    }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent2);
      animation: livePulse 2.4s ease-in-out infinite;
    }
    @keyframes livePulse {
      0%,100% { opacity:1; box-shadow: 0 0 0 0 var(--accent2); }
      50% { opacity:0.6; box-shadow: 0 0 0 4px transparent; }
    }

    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .hbtn {
      width: 34px; height: 34px; border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface2); color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all var(--transition);
      flex-shrink: 0;
    }
    .hbtn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    .hbtn.loading svg { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── TIMER BAR ── */
    .timer-track {
      position: fixed; top: 60px; left: 0; right: 0;
      height: 2px; background: var(--border); z-index: 99;
    }
    .timer-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 1s linear;
    }

    /* ── MAIN ── */
    .main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }

    /* ── FILTER ── */
    .filter-section { margin-bottom: 20px; }
    .search-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .search-box {
      flex: 1; min-width: 180px;
      height: 42px; padding: 0 14px 0 40px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text-primary);
      font-size: 14px; font-family: var(--sans);
      outline: none; transition: all var(--transition);
    }
    .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search-box::placeholder { color: var(--text-muted); }
    .search-wrap { position: relative; flex: 1; min-width: 180px; }
    .search-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
    }

    .sort-select {
      height: 42px; padding: 0 12px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text-primary);
      font-size: 13px; font-family: var(--sans);
      outline: none; cursor: pointer;
      transition: border-color var(--transition);
    }
    .sort-select:focus { border-color: var(--accent); }
    .sort-select option { background: var(--surface); color: var(--text-primary); }

    /* category chips */
    .chips-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .chip {
      height: 32px; padding: 0 14px;
      border: 1.5px solid var(--border); border-radius: 20px;
      background: var(--surface); color: var(--text-secondary);
      font-size: 12.5px; font-family: var(--sans);
      cursor: pointer; transition: all var(--transition);
      display: flex; align-items: center; gap: 5px;
      white-space: nowrap; flex-shrink: 0;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .chip-count {
      font-family: var(--mono); font-size: 11px;
      background: rgba(255,255,255,0.25);
      padding: 1px 5px; border-radius: 8px;
      color: inherit;
    }
    .chip:not(.active) .chip-count {
      background: var(--accent-soft); color: var(--accent);
    }

    /* ── STAT CARDS ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px; margin-bottom: 22px;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 14px 16px;
      box-shadow: var(--shadow-sm);
      display: flex; align-items: center; gap: 12px;
    }
    .stat-icon {
      width: 38px; height: 38px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
    }
    .stat-icon.blue { background: var(--accent-soft); }
    .stat-icon.green { background: var(--accent2-soft); }
    .stat-icon.amber { background: var(--warn-soft); }
    .stat-icon.red { background: var(--danger-soft); }
    .stat-num {
      font-family: var(--mono); font-size: 20px; font-weight: 700;
      line-height: 1.1;
    }
    .stat-num.blue { color: var(--accent); }
    .stat-num.green { color: var(--accent2); }
    .stat-num.amber { color: var(--warn); }
    .stat-num.red { color: var(--danger); }
    .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ── RESULT ROW ── */
    .result-row {
      display: flex; align-items: center;
      margin-bottom: 14px;
    }
    .result-count { font-size: 12.5px; color: var(--text-muted); }
    .result-count strong { color: var(--text-primary); font-weight: 600; }

    /* ── GRID ── */
    .inv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 13px;
    }

    .inv-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px 16px;
      box-shadow: var(--shadow-sm);
      position: relative; overflow: hidden;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
      animation: cardIn 0.3s ease both;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(8px); }
      to { opacity:1; transform: translateY(0); }
    }
    .inv-card::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: var(--radius);
      opacity: 0;
      background: linear-gradient(135deg, var(--accent-soft), transparent);
      transition: opacity var(--transition);
      pointer-events: none;
    }
    .inv-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent);
    }
    .inv-card:hover::after { opacity: 1; }

    /* left accent bar */
    .card-bar {
      position: absolute; left: 0; top: 16px; bottom: 16px;
      width: 3px; border-radius: 0 3px 3px 0;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      opacity: 0; transition: opacity var(--transition);
    }
    .inv-card:hover .card-bar { opacity: 1; }

    .card-head {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 10px; margin-bottom: 12px;
    }
    .item-name { color: var(--text-primary); font-size: 14.5px; font-weight: 600; line-height: 1.4; flex: 1; }
    .cat-tag {
      flex-shrink: 0; font-size: 10.5px; font-weight: 500;
      padding: 3px 8px; border-radius: 12px;
      background: var(--accent-soft); color: var(--accent);
      border: 1px solid rgba(59,110,248,0.15);
      letter-spacing: 0.2px;
    }

    /* stock row */
    .stock-row {
      display: flex; align-items: flex-end;
      justify-content: space-between; margin-top: 4px;
    }
    .stock-num {
      font-family: var(--mono); font-size: 36px;
      font-weight: 700; line-height: 1;
      color: var(--accent);
      transition: color var(--transition);
    }
    .stock-num.warn { color: var(--warn); }
    .stock-num.danger { color: var(--danger); }
    .stock-unit { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; margin-left: 4px; }

    /* timestamp badge */
    .ts-badge {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 8px; border-radius: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      font-family: var(--mono); font-size: 10px;
      color: var(--text-muted); white-space: nowrap;
    }
    .ts-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent2); flex-shrink: 0; }

    /* progress bar */
    .prog-wrap { margin-top: 12px; }
    .prog-track {
      height: 3px; border-radius: 2px;
      background: var(--border); overflow: hidden;
    }
    .prog-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.7s cubic-bezier(0.4,0,0.2,1);
    }
    .prog-fill.warn { background: linear-gradient(90deg, var(--warn), #fcd34d); }
    .prog-fill.danger { background: var(--danger); }

    /* status label below bar */
    .stock-status {
      margin-top: 6px;
      font-size: 10.5px; font-weight: 500;
    }
    .stock-status.ok { color: var(--accent2); }
    .stock-status.warn { color: var(--warn); }
    .stock-status.danger { color: var(--danger); }

    /* ── EMPTY STATE ── */
    .empty-state {
      grid-column: 1/-1;
      text-align: center; padding: 80px 20px;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 52px; margin-bottom: 14px; opacity: 0.35; }
    .empty-state p { font-size: 14px; color: var(--text-secondary); }

    /* ── SKELETON ── */
    .skeleton {
      border-radius: 6px;
      background: linear-gradient(90deg,
        var(--border) 0%, var(--surface2) 50%, var(--border) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 200;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 11px 16px;
      font-size: 13px; box-shadow: var(--shadow-lg);
      display: flex; align-items: center; gap: 9px;
      transform: translateY(16px) scale(0.96);
      opacity: 0; transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events: none; max-width: 260px;
      color: var(--text-primary);
    }
    .toast.show { transform: translateY(0) scale(1); opacity: 1; }

    /* ── RESPONSIVE (手機自適應優化) ── */
    @media (max-width: 768px) {
      .search-row { flex-direction: column; gap: 10px; }
      .search-wrap { width: 100%; }
      .sort-select { width: 100%; }
      .chips-row { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
      .chip { flex-shrink: 0; }
    }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stat-card { padding: 12px; }
      .stat-icon { width: 34px; height: 34px; font-size: 15px; }
      .stat-num { font-size: 18px; }
      
      .header-inner { gap: 8px; }
      .status-pill { display: none; } /* 手機端隱藏過長的更新時間標籤 */
      
      .main { padding: 16px 14px 70px; }
      .inv-grid { grid-template-columns: 1fr; gap: 12px; } /* 手機端轉換為單欄大卡片 */
      .inv-card { padding: 16px; }
    }

    /* ══════════════════════════════════════════════════
       📱 iPhone 專屬行列式介面 (≤ 430px)
       ══════════════════════════════════════════════════ */
    
    /* 手機版：隱藏 desktop Grid，顯示 mobile List */
    .inv-list-mobile { display: none; }

    @media (max-width: 430px) {

      /* 隱藏桌面版 Grid */
      .inv-grid { display: none !important; }

      /* 顯示手機版 List */
      .inv-list-mobile { display: block; }

      /* ── iPhone 安全區域支援 ── */
      body { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .main {
        padding: 14px 0 calc(32px + env(safe-area-inset-bottom, 0px));
        max-width: 100%;
      }

      /* ── 統計卡片手機版調整 ── */
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin: 0 14px 16px;
      }
      .stat-card { padding: 12px 14px; gap: 10px; }
      .stat-icon { width: 32px; height: 32px; font-size: 14px; }
      .stat-num { font-size: 20px; }
      .stat-label { font-size: 10.5px; }

      /* ── 篩選區塊手機版調整 ── */
      .filter-section { padding: 0 14px; margin-bottom: 14px; }
      .search-box { height: 46px; font-size: 16px; /* iOS 防止自動縮放 */ border-radius: 12px; }
      .sort-select { height: 46px; font-size: 15px; border-radius: 12px; }

      /* chips 水平滑動 */
      .chips-row {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding: 2px 0 10px;
        gap: 8px;
        scrollbar-width: none; /* Firefox */
      }
      .chips-row::-webkit-scrollbar { display: none; }
      .chip { height: 36px; padding: 0 16px; font-size: 13px; }

      /* ── 結果計數 ── */
      .result-row { padding: 0 14px; margin-bottom: 10px; }
      .result-count { font-size: 12px; }

      /* ── 手機版 List 容器 ── */
      .inv-list-mobile {
        background: var(--surface);
        border-radius: var(--radius);
        margin: 0 14px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      /* ── 行列項目 ── */
      .mob-row {
        display: flex;
        align-items: center;
        min-height: 68px;
        padding: 12px 16px 12px 20px;
        border-bottom: 1px solid var(--border);
        position: relative;
        transition: background var(--transition);
        -webkit-tap-highlight-color: transparent;
        cursor: default;
        animation: mobRowIn 0.25s ease both;
      }
      .mob-row:last-child { border-bottom: none; }
      .mob-row:active { background: var(--surface2); }

      @keyframes mobRowIn {
        from { opacity: 0; transform: translateX(-6px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      /* 左側狀態色條 */
      .mob-strip {
        position: absolute;
        left: 0; top: 10px; bottom: 10px;
        width: 4px; border-radius: 0 3px 3px 0;
        background: linear-gradient(180deg, var(--accent), var(--accent2));
        flex-shrink: 0;
      }
      .mob-strip.warn    { background: var(--warn); }
      .mob-strip.danger  { background: var(--danger); }

      /* 中間：名稱 + 分類 + 時間 */
      .mob-info {
        flex: 1;
        min-width: 0; /* 防止 overflow */
        padding-right: 12px;
      }
      .mob-name {
        font-size: 14px; font-weight: 600;
        color: var(--text-primary); line-height: 1.35;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        margin-bottom: 4px;
      }
      .mob-meta {
        display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      }
      .mob-cat {
        font-size: 10px; font-weight: 500;
        padding: 2px 7px; border-radius: 10px;
        background: var(--accent-soft); color: var(--accent);
        border: 1px solid rgba(59,110,248,0.12);
        white-space: nowrap;
        flex-shrink: 0;
      }
      .mob-time {
        font-family: var(--mono); font-size: 10px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
      }
      .mob-status-label {
        font-size: 10px; font-weight: 500;
        white-space: nowrap;
      }
      .mob-status-label.ok     { color: var(--accent2); }
      .mob-status-label.warn   { color: var(--warn); }
      .mob-status-label.danger { color: var(--danger); }

      /* 右側：庫存數量 */
      .mob-stock-wrap {
        display: flex; flex-direction: column;
        align-items: flex-end; justify-content: center;
        flex-shrink: 0; min-width: 52px;
      }
      .mob-stock-num {
        font-family: var(--mono); font-size: 28px; font-weight: 700;
        line-height: 1; color: var(--accent);
        transition: color var(--transition);
      }
      .mob-stock-num.warn   { color: var(--warn); }
      .mob-stock-num.danger { color: var(--danger); }
      .mob-stock-unit {
        font-size: 10px; color: var(--text-muted); margin-top: 2px;
      }

      /* ── 手機版 Empty State ── */
      .mob-empty {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 64px 20px;
        color: var(--text-muted);
      }
      .mob-empty-icon { font-size: 44px; margin-bottom: 12px; opacity: 0.35; }
      .mob-empty p { font-size: 14px; color: var(--text-secondary); }

      /* ── 手機版 Skeleton ── */
      .mob-skeleton-row {
        display: flex; align-items: center;
        min-height: 68px; padding: 12px 16px 12px 20px;
        border-bottom: 1px solid var(--border); gap: 12px;
      }
      .mob-skeleton-row:last-child { border-bottom: none; }
      .mob-skel-strip {
        width: 4px; height: 40px; border-radius: 2px;
        background: var(--border);
      }
      .mob-skel-body { flex: 1; }
      .mob-skel-right { flex-shrink: 0; width: 44px; }

      /* ── Toast 手機版位置（加上安全距離）── */
      .toast {
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        left: 16px; right: 16px;
        max-width: none;
        justify-content: center;
      }

      /* ── Header 手機版 ── */
      .header { padding: 0 14px; }
      .header-inner { height: 56px; }
      .logo { font-size: 15px; }
      .logo-box { width: 30px; height: 30px; font-size: 14px; }
      .hbtn { width: 38px; height: 38px; } /* 較大觸控面積 */
    }
  </style>
</head>
<body data-theme="light">

<!-- Timer bar -->
<div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-box">📦</div>
      <span>庫存查看</span>
    </div>

        ⚙️

        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
          <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
        </svg>
      </button>
      <button class="hbtn" id="themeBtn" title="切換主題" onclick="toggleTheme()">
        <svg id="themeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="main">

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon blue">📋</div>
      <div><div class="stat-num blue" id="statItems">—</div><div class="stat-label">總品項數</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green">📊</div>
      <div><div class="stat-num green" id="statTotal">—</div><div class="stat-label">總庫存量</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber">⚠️</div>
      <div><div class="stat-num amber" id="statLow">—</div><div class="stat-label">低庫存 (&lt;10)</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon red">🚫</div>
      <div><div class="stat-num red" id="statZero">—</div><div class="stat-label">已缺貨</div></div>
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-section">
    <div class="search-row">
      <div class="search-wrap">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="search-box" id="searchInput" type="text" placeholder="搜尋物品名稱…" oninput="filterAndRender()">
      </div>
      <select class="sort-select" id="sortSelect" onchange="filterAndRender()">
        <option value="default">預設排序</option>
        <option value="stock_asc">庫存量 ↑</option>
        <option value="stock_desc">庫存量 ↓</option>
        <option value="name">名稱排序</option>
        <option value="time">最新更新</option>
      </select>
    </div>
    <div class="chips-row" id="chipsRow">
      <button class="chip active" data-cat="" onclick="selectCat(this,'')">全部</button>
    </div>
  </div>

  <!-- Result row -->
  <div class="result-row">
    <div class="result-count" id="resultCount">—</div>
  </div>

  <!-- Desktop Grid -->
  <div class="inv-grid" id="invGrid">
    <!-- skeletons -->
    <div class="inv-card" style="height:150px">
      <div class="skeleton" style="height:14px;width:65%;margin-bottom:10px"></div>
      <div class="skeleton" style="height:10px;width:30%;margin-bottom:18px"></div>
      <div class="skeleton" style="height:34px;width:45%;margin-bottom:12px"></div>
      <div class="skeleton" style="height:3px;width:100%"></div>
    </div>
    <div class="inv-card" style="height:150px">
      <div class="skeleton" style="height:14px;width:80%;margin-bottom:10px"></div>
      <div class="skeleton" style="height:10px;width:35%;margin-bottom:18px"></div>
      <div class="skeleton" style="height:34px;width:35%;margin-bottom:12px"></div>
      <div class="skeleton" style="height:3px;width:100%"></div>
    </div>
    <div class="inv-card" style="height:150px">
      <div class="skeleton" style="height:14px;width:55%;margin-bottom:10px"></div>
      <div class="skeleton" style="height:10px;width:40%;margin-bottom:18px"></div>
      <div class="skeleton" style="height:34px;width:50%;margin-bottom:12px"></div>
      <div class="skeleton" style="height:3px;width:100%"></div>

  <!-- 📱 Mobile List（手機版，≤ 430px 顯示） -->
  <div class="inv-list-mobile" id="invListMobile">
    <!-- 手機版 Skeleton -->
    <div class="mob-skeleton-row">

        <div class="skeleton" style="height:13px;width:55%;margin-bottom:8px;border-radius:5px"></div>
        <div class="skeleton" style="height:10px;width:50%;border-radius:5px"></div>
      </div>
      <div class="mob-skel-right">
        <div class="skeleton" style="height:28px;width:100%;border-radius:5px"></div>
      </div>
    </div>
    <div class="mob-skeleton-row">
      <div class="mob-skel-strip skeleton"></div>
      <div class="mob-skel-body">
        <div class="skeleton" style="height:13px;width:80%;margin-bottom:8px;border-radius:5px"></div>
        <div class="skeleton" style="height:10px;width:36%;border-radius:5px"></div>
      </div>

</main>

<!-- Toast -->
<div class="toast" id="toast">
  <span id="toastIcon">✅</span>
  <span id="toastMsg">已更新</span>
</div>

<script>
  // ── Config ──
  let API_URL = ""; 
  const AUTO_MIN = 15;
  const LOW_THRESHOLD = 10;

  // ── State ──
  let allItems = [];
  let selectedCat = '';
  let countdown = AUTO_MIN * 60;
  let timerInterval = null;

  // ── Init ──
  window.addEventListener('DOMContentLoaded', () => {
    applyTheme(localStorage.getItem('invTheme') || 'light');
    
    // 檢查 API URL (同首頁邏輯)
    const urlParams = new URLSearchParams(window.location.search);
    const apiParam = urlParams.get('api');
    
    if (apiParam) {
      API_URL = decodeURIComponent(apiParam);
      localStorage.setItem('GAS_API_URL', API_URL);
      // 清除網址列參數
      window.history.replaceState({}, document.title, window.location.pathname);
    } else {
      API_URL = localStorage.getItem('GAS_API_URL');
    }

    if (!API_URL) {
      document.getElementById('lastUpdateText').textContent = "⚠️ 尚未設定 API";
      // 延遲呼叫避免剛進畫面就彈出
      setTimeout(setApiUrlUI, 500);
      return;
    }

    loadData();
    startTimer();
  });

  // ── 設定 API 介面 ──
  function setApiUrlUI() {
    const currentApi = localStorage.getItem('GAS_API_URL') || "";
    const userApi = prompt("⚙️ 系統設定\n\n請輸入您的 Google Apps Script 部署網址 (結尾為 /exec)：", currentApi);
    
    if (userApi !== null) {
      if (userApi.trim() === "") {
        alert("❌ 網址不能為空！");
      } else {
        localStorage.setItem('GAS_API_URL', userApi.trim());
        API_URL = userApi.trim();
        alert("✅ 設定儲存成功！系統將重新載入。");
        location.reload();
      }
    }
  }

  // ── Data via Fetch API ──
  function loadData() {
    if (!API_URL) return;
    
    // 這裡我們直接利用原先 GAS API 中的 ?page=api 路由 (回傳 GET 的 JSON 檔案)
    fetch(API_URL + '?page=api')
      .then(res => res.json())
      .then(data => onDataLoaded(data))
      .catch(err => onDataError(err));
  }

  function onDataLoaded(data) {
    try {
      allItems = data.items || [];
    } catch(e) {
      allItems = [];
    }
    updateStatusLabel();
    buildChips();
    filterAndRender();
    updateStats();
    showToast('✅', '庫存已更新');
  }

  function onDataError(err) {
    showToast('❌', '更新失敗，請檢查網路或 API 設定');
    console.error(err);
  }

  // ── Timer ──
  function startTimer() {
    countdown = AUTO_MIN * 60;
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      countdown--;
      document.getElementById('timerFill').style.width =
        ((AUTO_MIN * 60 - countdown) / (AUTO_MIN * 60) * 100) + '%';
      if (countdown <= 0) {
        countdown = AUTO_MIN * 60;
        loadData();
      }
    }, 1000);
  }

  function manualRefresh() {
    if (!API_URL) return alert('請先設定 API！');
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('loading');
    setTimeout(() => btn.classList.remove('loading'), 900);
    countdown = AUTO_MIN * 60;
    document.getElementById('timerFill').style.width = '0%';
    loadData();
  }

  // ── Chips ──
  function buildChips() {
    const cats = [...new Set(allItems.map(i => i.category))].sort();
    const row = document.getElementById('chipsRow');
    const allCount = allItems.length;
    row.innerHTML = `<button class="chip ${selectedCat===''?'active':''}" data-cat="" onclick="selectCat(this,'')">全部 <span class="chip-count">${allCount}</span></button>`;
    cats.forEach(cat => {
      const n = allItems.filter(i => i.category === cat).length;
      const btn = document.createElement('button');
      btn.className = 'chip' + (selectedCat === cat ? ' active' : '');
      btn.dataset.cat = cat;
      btn.innerHTML = `${esc(cat)} <span class="chip-count">${n}</span>`;
      btn.onclick = () => selectCat(btn, cat);
      row.appendChild(btn);
    });
  }

  function selectCat(el, cat) {
    selectedCat = cat;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    filterAndRender();
  }

  // ── Filter & Render ──
  function filterAndRender() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const sort = document.getElementById('sortSelect').value;
    let items = allItems.filter(item => {
      const matchCat = !selectedCat || item.category === selectedCat;
      const matchQ = !q || item.name.toLowerCase().includes(q) || item.category.toLowerCase().includes(q);
      return matchCat && matchQ;
    });
    
    // 陣列排序
    if (sort === 'stock_asc')  items.sort((a,b) => a.stock - b.stock);
    if (sort === 'stock_desc') items.sort((a,b) => b.stock - a.stock);
    if (sort === 'name')       items.sort((a,b) => a.name.localeCompare(b.name, 'zh-TW'));
    if (sort === 'time')       items.sort((a,b) => (b.lastEdit||'').localeCompare(a.lastEdit||''));
    
    renderGrid(items);
    renderMobileList(items);
    document.getElementById('resultCount').innerHTML =
      `顯示 <strong>${items.length}</strong> 筆 / 共 ${allItems.length} 筆`;
  }

  function renderGrid(items) {
    const grid = document.getElementById('invGrid');
    if (!items.length) {
      grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><p>找不到符合的品項</p></div>`;
      return;
    }
    const maxStock = Math.max(...allItems.map(i => i.stock), 1);
    grid.innerHTML = items.map((item, idx) => {
      const pct = Math.min(100, (item.stock / maxStock) * 100).toFixed(1);
      const isZero = item.stock === 0;
      const isLow  = item.stock > 0 && item.stock < LOW_THRESHOLD;
      const cls    = isZero ? 'danger' : isLow ? 'warn' : '';
      const statusTxt = isZero ? '🚫 已缺貨' : isLow ? '⚠️ 庫存偏低' : '✅ 庫存正常';
      return `
        <div class="inv-card" style="animation-delay:${idx * 0.03}s">
          <div class="card-bar"></div>
          <div class="card-head">
            <div class="item-name">${esc(item.name)}</div>
            <div class="cat-tag">${esc(item.category)}</div>
          </div>
          <div class="stock-row">
            <div style="display:flex;align-items:baseline;gap:4px">
              <div class="stock-num ${cls}">${item.stock}</div>
              <div class="stock-unit">件</div>
            </div>
            <div class="ts-badge">
              <div class="ts-dot"></div>
              ${esc(item.lastEdit || '—')}
            </div>
          </div>
          <div class="prog-wrap">
            <div class="prog-track">
              <div class="prog-fill ${cls}" style="width:${pct}%"></div>
            </div>
            <div class="stock-status ${cls || 'ok'}">${statusTxt}</div>
          </div>
        </div>`;
    }).join('');
  }

  // ── 📱 手機版 List 渲染 ──
  function renderMobileList(items) {
    const list = document.getElementById('invListMobile');
    if (!items.length) {
      list.innerHTML = `
        <div class="mob-empty">
          <div class="mob-empty-icon">🔍</div>
          <p>找不到符合的品項</p>
        </div>`;
      return;
    }
    list.innerHTML = items.map((item, idx) => {
      const isZero = item.stock === 0;
      const isLow  = item.stock > 0 && item.stock < LOW_THRESHOLD;
      const cls    = isZero ? 'danger' : isLow ? 'warn' : '';
      const statusTxt = isZero ? '🚫 已缺貨' : isLow ? '⚠️ 偏低' : '✅ 正常';
      const statusCls = isZero ? 'danger' : isLow ? 'warn' : 'ok';
      return `
        <div class="mob-row" style="animation-delay:${idx * 0.025}s">
          <div class="mob-strip ${cls}"></div>
          <div class="mob-info">
            <div class="mob-name">${esc(item.name)}</div>
            <div class="mob-meta">
              <span class="mob-cat">${esc(item.category)}</span>
              <span class="mob-time">${esc(item.lastEdit || '—')}</span>
              <span class="mob-status-label ${statusCls}">${statusTxt}</span>
            </div>
          </div>
          <div class="mob-stock-wrap">
            <div class="mob-stock-num ${cls}">${item.stock}</div>
            <div class="mob-stock-unit">件</div>
          </div>
        </div>`;
    }).join('');
  }

  // ── Stats ──
  function updateStats() {
    document.getElementById('statItems').textContent = allItems.length;
    document.getElementById('statTotal').textContent = allItems.reduce((s,i) => s+i.stock, 0).toLocaleString();
    document.getElementById('statLow').textContent   = allItems.filter(i => i.stock > 0 && i.stock < LOW_THRESHOLD).length;
    document.getElementById('statZero').textContent  = allItems.filter(i => i.stock === 0).length;
  }

  // ── Status Label ──
  function updateStatusLabel() {
    const now = new Date();
    const tw = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
    const p = n => String(n).padStart(2,'0');
    document.getElementById('lastUpdateText').textContent =
      `${tw.getFullYear()}-${p(tw.getMonth()+1)}-${p(tw.getDate())} ${p(tw.getHours())}:${p(tw.getMinutes())}:${p(tw.getSeconds())}`;
  }

  // ── Theme ──
  function toggleTheme() {
    const cur = document.body.dataset.theme;
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }
  function applyTheme(t) {
    document.body.dataset.theme = t;
    localStorage.setItem('invTheme', t);
    const icon = document.getElementById('themeIcon');
    icon.innerHTML = t === 'dark'
      ? `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`
      : `<circle cx="12" cy="12" r="5"/>
         <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
         <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
         <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
         <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
  }

  // ── Toast ──
  let _toastTimer;
  function showToast(icon, msg) {
    document.getElementById('toastIcon').textContent = icon;
    document.getElementById('toastMsg').textContent = msg;
    const t = document.getElementById('toast');
    t.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }

  // ── Helpers ──
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
